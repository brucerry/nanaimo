name: Windows x64 and x86 builds

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_tests:
        description: Also test x64 and x86 processes on Windows 10 and 11 desktop runners
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Modern ${{ matrix.architecture }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        architecture: [x64, x86]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_NOLOGO: true
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/tools/requirements-localization.txt
      - name: Build and test the source checkout
        shell: pwsh
        run: ./server/tools/test-windows-build.ps1 -Target Modern -Architecture '${{ matrix.architecture }}'

  legacy:
    name: Windows 7 target ${{ matrix.architecture }} build and test
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_NOLOGO: true
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/tools/requirements-localization.txt
      - name: Build and test the Windows 7 compatible target on Windows Server 2022
        shell: pwsh
        run: ./server/tools/test-windows-build.ps1 -Target Win7 -Architecture '${{ matrix.architecture }}'

  desktop:
    name: Test Windows ${{ matrix.version }} ${{ matrix.architecture }} process
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_tests
    strategy:
      fail-fast: false
      matrix:
        version: ['10', '11']
        architecture: [x64, x86]
    runs-on: [self-hosted, Windows, X64, 'nanaimo-windows-${{ matrix.version }}']
    timeout-minutes: 25
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/tools/requirements-localization.txt
      - name: Verify desktop OS
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.ProductType -ne 1) { throw 'A desktop Windows runner is required.' }
          if ([int]$os.BuildNumber -lt 10240) { throw 'Windows 10 or newer is required.' }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'An x64 runner is required.' }
          $expected = '${{ matrix.version }}'
          $actual = if ([int]$os.BuildNumber -ge 22000) { '11' } else { '10' }
          if ($actual -ne $expected) { throw "Expected Windows $expected; found $actual." }
      - name: Build and test ${{ matrix.architecture }} runtime
        shell: pwsh
        run: ./server/tools/test-windows-build.ps1 -Target Modern -Architecture '${{ matrix.architecture }}'
